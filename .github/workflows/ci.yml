name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build library and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu-latest image ships the Android SDK (platform 34, build-tools 34) at ANDROID_HOME.
      - name: Test licence key for the example (optional secret)
        run: echo "yatmo.licenseKey=${{ secrets.YATMO_TEST_LICENSE_KEY }}" >> local.properties
      - name: Build
        run: chmod +x gradlew && ./gradlew :yatmo-sdk:assembleRelease :example:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: yatmo-sdk-release-aar
          path: yatmo-sdk/build/outputs/aar/yatmo-sdk-release.aar
